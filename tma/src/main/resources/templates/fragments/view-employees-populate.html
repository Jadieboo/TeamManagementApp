<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="../register.css">
    <script src="https://kit.fontawesome.com/ef4342f3da.js" crossorigin="anonymous"></script>
    <!--    <script src="https://cdn.tailwindcss.com"></script>-->
  </head>

  <body>
    <a th:fragment="admin-populate" th:href="@{/admin/view/employees/{id}(id = ${employee.id})}"
       class="flex flex-col items-center text-center gap-2">
        <img th:src="@{/static/images/profile-unsplash.jpg}"
             alt="Employee profile picture"
             class="w-48 h-48 rounded-full object-cover hover:shadow-xl-mid"
        />
        <div>
            <h3 th:text="${employee.getFirstName()} + ' ' + ${employee.getLastName()}"
                class="font-semibold text-xl truncate w-full">
                Name
            </h3>
            <!--          TODO: figure out if you want to show manager role-->
            <!--        <p th:if="${employee.getRole() != null and employee.getRole() == T(com.sparta.tma.entities.Role).MANAGER}"-->
            <!--           th:text="${employee.getRole()}">-->
            <!--        </p>-->
            <p th:text="'Team: ' + ${employee.getDepartment()}"
               class="text-md text-gray-700 truncate w-full">
                Team
            </p>
            <p th:text="'Project: ' + ${employee.getProject()}"
               class="text-md text-gray-700 truncate w-full">
                Project
            </p>
        </div>
    </a>



    <a th:fragment="manager-populate" th:href="@{/manager/view/employees/{id}(id = ${employee.id})}"
       class="flex flex-col items-center text-center gap-2">
        <img th:src="@{/static/images/profile-unsplash.jpg}"
             alt="Employee profile picture"
             class="w-48 h-48 rounded-full object-cover hover:shadow-xl-mid"
        />
        <div>
            <h3 th:text="${employee.getFirstName()} + ' ' + ${employee.getLastName()}"
                class="font-semibold text-xl truncate w-full">
                Name
            </h3>
            <!--          TODO: figure out if you want to show manager role-->
            <!--        <p th:if="${employee.getRole() != null and employee.getRole() == T(com.sparta.tma.entities.Role).MANAGER}"-->
            <!--           th:text="${employee.getRole()}">-->
            <!--        </p>-->
            <p th:text="'Project: ' + ${employee.getProject()}"
               class="text-md text-gray-700 truncate w-full">
                Project
            </p>
        </div>
    </a>


    <a th:fragment="employee-populate"
       class="flex flex-col items-center text-center gap-2">
        <img th:src="@{/static/images/profile-unsplash.jpg}"
             alt="Employee profile picture"
             class="w-48 h-48 rounded-full object-cover hover:shadow-xl-mid"
        />
        <div>
            <h3 th:text="${employee.getFirstName()} + ' ' + ${employee.getLastName()}"
                class="font-semibold text-xl truncate w-full">
                Name
            </h3>
            <!--          TODO: figure out if you want to show manager role-->
            <!--        <p th:if="${employee.getRole() != null and employee.getRole() == T(com.sparta.tma.entities.Role).MANAGER}"-->
            <!--           th:text="${employee.getRole()}">-->
            <!--        </p>-->
            <p th:text="'Project: ' + ${employee.getProject()}"
               class="text-md text-gray-700 truncate w-full">
                Project
            </p>
        </div>
    </a>

    <!--  edit icon link  -->
    <a th:fragment="edit-icon-a" th:href="@{/admin/view/employees/update/{id}(id = *{employee.id})}">
      <i class="fa-solid fa-pen text-2xl" style="color: #5606ea;" onmouseover="addBounceClass(this)"
         onmouseout="removeBounceClass(this)"></i>
    </a>

    <a th:fragment="edit-icon-m" th:href="@{/manager/view/employees/update/{id}(id = *{employee.id})}">
      <i class="fa-solid fa-pen text-2xl" style="color: #5606ea;" onmouseover="addBounceClass(this)"
         onmouseout="removeBounceClass(this)"></i>
    </a>

    <!--  TEAM VIEW  -->
    <a th:fragment="admin-team" th:href="@{/admin/view/employees/{id}(id = ${employee.id})}"
       class="flex flex-col items-center text-center gap-2">
        <img th:src="@{/static/images/profile-unsplash.jpg}"
             alt="Employee profile picture"
             class="w-48 h-48 rounded-full object-cover hover:shadow-xl-mid"
        />
        <div>
            <h3 th:text="${employee.getFirstName()} + ' ' + ${employee.getLastName()}"
                class="font-semibold text-xl truncate w-full">
                Name
            </h3>
            <!--          TODO: figure out if you want to show manager role-->
            <!--        <p th:if="${employee.getRole() != null and employee.getRole() == T(com.sparta.tma.entities.Role).MANAGER}"-->
            <!--           th:text="${employee.getRole()}">-->
            <!--        </p>-->
            <p th:text="'Project: ' + ${employee.getProject()}"
               class="text-md text-gray-700 truncate w-full">
                Project
            </p>
        </div>
    </a>

  </body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Homepage</title>
        <link rel="stylesheet" type="text/css" th:href="@{/static/css/output.css}"/>
<!--        <script src="https://cdn.tailwindcss.com"></script>-->

    </head>
    <body>


<!--        todo: need to add the side bar section to all pages with navigation
            todo: mobile nav starts with menu on when logging in or refreshing
-->

        <div class="fixed w-48 p-1 flex justify-between z-50 lg:hidden">
            <button
                    onclick="toggle()"
                    class="show-nav-btn z-50 w-max h-max text-3xl hover:font-medium md:text-2xl">
                >>
            </button>

            <button
                    onclick="toggle()"
                    class="hide-nav-btn z-50 w-max h-max text-3xl hidden hover:font-medium md:text-2xl">
                <<
            </button>
        </div>

        <div class="sidebar fixed top-0 left-0 z-40 h-screen w-full p-0 lg:flex lg:w-48">
            <nav th:replace="~{fragments/admin-navbar-fragment :: admin-navbar}"
                 class="absolute top-0 left-0 bg-gray-200 w-48 h-screen"></nav>
        </div>

        <main class="flex flex-col h-screen m-auto justify-evenly lg:ml-[190px]">

            <section class="border-4 !border-red-500 border-solid w-full max-w-full">
                <div class="flex flex-row justify-center md:flex-row bg-blue-500 p-8 gap-6">
                    <div>
                        <img
                                th:src="@{/static/images/profile-unsplash.jpg}"
                                alt="Employee profile picture"
                                class="w-80 h-80 rounded-full"
                        />
                    </div>

                    <div class="flex flex-col justify-center">
                        <h1 class="text-4xl">Welcome,</h1>
                        <h2 class="text-3xl" th:text="${employee.getFirstName()} + ' ' + ${employee.getLastName()}">Name</h2>
                    </div>
                </div>
            </section>

<!--            TODO: FIX A TAG - I BROKE IT!!!-->

            <section class="flex justify-center w-full">
                <section th:if="${results_populated}"
                         class="bg-pink-500 flex flex-col gap-4 w-3/4 justify-center
                       lg:flex-row lg:flex-wrap">
                    <section th:each="employee : ${employeeList}"
                             class="block p-4 bg-pink-300 border border-black rounded-lg shadow-lg hover:bg-red-500 transition-all ease-in-out h-[200px] w-full lg:w-1/4">
                        <a th:replace="${isAdmin} ? ~{fragments/view-employees-populate :: admin-team} : ~{}"></a>
                    </section>

                </section>

                <section th:if="${results_not_found}">
                    <h2>No team available yet!</h2>
                </section>
            </section>
        </main>
